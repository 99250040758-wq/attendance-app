<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>
    <p th:if="${param.error}" style="color:red">Wrong email or password.</p>
    <p th:if="${param.logout}" style="color:green">You have been logged out.</p>

    <form method="post" th:action="@{/login}">
        <input type="email" name="username" placeholder="Email" required><br><br>
        <input type="password" name="password" placeholder="Password" required><br><br>
        <button type="submit">Login</button>
    </form>
    <p><a href="/register.html">Create an account</a></p>
</body>
</html>
