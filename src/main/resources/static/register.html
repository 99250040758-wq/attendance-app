<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register Student</title>
</head>
<body>
  <h2>Register Student</h2>
  <input id="name" placeholder="Name"><br><br>
  <input id="roll" placeholder="Roll number"><br><br>
  <input id="email" placeholder="Email"><br><br>
  <input id="pass" type="password" placeholder="Password"><br><br>
  <button onclick="save()">Register</button>
  <p id="msg"></p>

  <script>
    function save() {
      fetch('/api/users/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          rollNumber: document.getElementById('roll').value,
          email: document.getElementById('email').value,
          password: document.getElementById('pass').value
        })
      })
      .then(r => r.ok ? 'Saved' : 'Error ' + r.status)
      .then(t => document.getElementById('msg').innerText = t);
    }
  </script>
</body>
</html>
